{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — United</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dashboard/css/tokens.css' %}">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      background: radial-gradient(circle at 30% 20%, rgba(155,138,217,0.25), transparent 55%),
                  radial-gradient(circle at 75% 80%, rgba(95,175,141,0.18), transparent 50%),
                  var(--bg);
    }
    .blob {
      position: absolute; width: 480px; height: 480px; border-radius: 50%;
      background: rgba(155,138,217,0.15); filter: blur(90px);
      top: -120px; left: -120px; animation: drift 14s ease-in-out infinite alternate;
    }
    .blob.two {
      background: rgba(95,175,141,0.12); top: auto; left: auto; bottom: -140px; right: -140px;
      animation-duration: 18s;
    }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px, 30px); } }

    .card {
      position: relative; z-index: 1; width: 360px; padding: 32px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      animation: rise 0.5s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .card h1 { font-size: 20px; margin-bottom: 4px; }
    .card p { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 24px; }

    label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; color: var(--text-primary); font-size: 13.5px;
      margin-bottom: 16px; transition: border-color 0.15s ease;
    }
    input:focus { outline: none; border-color: #6D7688; }

    button.submit {
      width: 100%; background: var(--text-primary); color: var(--bg); border: none;
      border-radius: 10px; padding: 11px; font-weight: 600; font-size: 13.5px; cursor: pointer;
      transition: transform 0.1s ease;
    }
    button.submit:hover { transform: translateY(-1px); }

    .errors { color: var(--danger); font-size: 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="blob"></div>
  <div class="blob two"></div>

  <div class="card">
    <h1>United</h1>
    <p>Entrar na dashboard</p>

    {% if form.errors %}
      <div class="errors">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Usuário</label>
      <input type="text" name="username" id="id_username" autofocus>
      <label for="id_password">Senha</label>
      <input type="password" name="password" id="id_password">
      <button class="submit" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
