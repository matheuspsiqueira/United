{% extends 'dashboard/publico_base.html' %}
{% block content %}
<div class="modal-header"><h3>Quero ser voluntário</h3></div>
<div class="modal-body">
  <p class="muted" style="margin-bottom:14px;">Digite seu usuário (o mesmo que você usa pra entrar no app) pra continuar.</p>
  <form method="post">
    {% csrf_token %}
    <label style="margin-top:0;">Usuário</label>
    <input type="text" name="username" autocapitalize="none" autocorrect="off" required>
    <div class="modal-footer">
      <button type="submit" class="submit">Continuar</button>
    </div>
  </form>
</div>
{% endblock %}
