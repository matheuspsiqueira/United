<div class="modal-card wide">
  <div class="modal-header">
    <h3>Membros — {{ ugroup.nome }}</h3>
    <button type="button" data-modal-close class="modal-close">✕</button>
  </div>
  <div class="modal-body">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Nome</th><th>Desde</th><th></th></tr>
        </thead>
        <tbody>
          {% for membro in membros %}
            <tr>
              <td>{{ membro.usuario.nome_completo }}</td>
              <td class="muted">{{ membro.entrou_em|date:"d/m/Y" }}</td>
              <td>
                <form method="post" action="{% url 'dashboard:ugroup_membro_remover' ugroup.pk membro.pk %}" onsubmit="return confirm('Remover esse membro do uGroup?');">
                  {% csrf_token %}
                  <button class="btn-danger-sm" type="submit">Remover</button>
                </form>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="3" class="muted">Nenhum membro cadastrado ainda.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
